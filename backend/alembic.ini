# For the alembic CLI, run from backend/ (the app itself runs migrations on
# startup, see app/schema.py). New migration after changing app/db_models.py:
#   SDIP_DATABASE_URL=sqlite:///./crm.db alembic revision --autogenerate -m "describe change"
[alembic]
script_location = app/migrations
prepend_sys_path = .
